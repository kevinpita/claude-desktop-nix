name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Evaluate all supported systems
        run: nix flake check --all-systems --no-build

      - name: Build claude-desktop
        run: nix build .#claude-desktop --print-build-logs

      - name: Verify claude-desktop contents
        run: |
          test -x ./result/bin/claude-desktop
          test -f ./result/share/applications/com.anthropic.Claude.desktop
